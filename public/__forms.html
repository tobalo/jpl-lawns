<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <!--
      Static skeleton so Netlify's build-time parser can detect the React
      contact form. The React form (src/components/ContactForm.tsx) submits
      via AJAX to /__forms.html. Field names MUST match the React form exactly.
    -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
